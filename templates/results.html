<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wine Quality Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Wine Quality Prediction</h1>

        <div class="result">
            Predicted Quality: {{ prediction }}
        </div>

        <a href="/">Predict Again</a>

    </div>

</body>

</html>
